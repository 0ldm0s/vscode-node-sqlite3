name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2022
            platform: win32
            arch: x64
            libc: unknown
          - os: windows-2022
            platform: win32
            arch: ia32
            libc: unknown
          # macOS
          - os: macos-13
            platform: darwin
            arch: x64
            libc: unknown
          - os: macos-14
            platform: darwin
            arch: arm64
            libc: unknown
          # Linux glibc
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            libc: glibc
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            libc: glibc
          # Linux musl (Alpine)
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            libc: musl
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            libc: musl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # musl builds need Alpine container
      - name: Build in Alpine container (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            alpine:3.19 \
            sh -c "
              apk add --no-cache python3 make g++ git nodejs npm linux-headers
              npm install --ignore-scripts
              for napi in 3 6; do
                binding_dir=lib/binding/napi-v\${napi}-${{ matrix.platform }}-${{ matrix.libc }}-${{ matrix.arch }}
                npx @mapbox/node-pre-gyp configure build --target_arch=${{ matrix.arch }} --napi_build_version=\${napi}
                mkdir -p \${binding_dir}
                cp build/Release/eva_sqlite3.node \${binding_dir}/
                npx @mapbox/node-pre-gyp package --target_arch=${{ matrix.arch }} --napi_build_version=\${napi}
              done
            "

      - name: Install dependencies (non-musl)
        if: matrix.libc != 'musl'
        run: npm install --ignore-scripts

      - name: Build & Package (non-musl)
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          for napi in 3 6; do
            export NAPI_VERSION=${napi}
            npx @mapbox/node-pre-gyp configure build --napi_build_version=${napi}
            echo "=== Searching for .node files ==="
            node -e "
              const fs = require('fs');
              const path = require('path');
              function walk(dir) {
                let results = [];
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory() && !entry.name.startsWith('.') && entry.name !== 'node_modules') {
                    results = results.concat(walk(full));
                  } else if (entry.name.endsWith('.node')) {
                    results.push(full);
                  }
                }
                return results;
              }
              const files = walk('.');
              console.log('Found .node files:', JSON.stringify(files, null, 2));
            "
            node -e "
              const fs = require('fs');
              const path = require('path');
              const cwd = process.cwd();
              const napi = process.env.NAPI_VERSION;
              const platform = '${{ matrix.platform }}';
              const libc = '${{ matrix.libc }}';
              const arch = '${{ matrix.arch }}';
              const destDir = path.join(cwd, 'lib', 'binding', 'napi-v' + napi + '-' + platform + '-' + libc + '-' + arch);
              fs.mkdirSync(destDir, { recursive: true });
              // Try multiple possible locations
              const candidates = [
                path.join(cwd, 'build', 'Release', 'eva_sqlite3.node'),
                path.join(cwd, 'lib', 'binding', 'napi-v' + napi + '-' + platform + '-' + libc + '-' + arch, 'eva_sqlite3.node'),
              ];
              let copied = false;
              for (const src of candidates) {
                if (fs.existsSync(src)) {
                  fs.copyFileSync(src, path.join(destDir, 'eva_sqlite3.node'));
                  console.log('Copied', src, 'to', path.join(destDir, 'eva_sqlite3.node'));
                  copied = true;
                  break;
                }
              }
              if (!copied) throw new Error('eva_sqlite3.node not found in any candidate location');
            "
            npx @mapbox/node-pre-gyp package --napi_build_version=${napi}
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: prebuilt-${{ matrix.platform }}-${{ matrix.libc }}-${{ matrix.arch }}
          path: build/stage/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
