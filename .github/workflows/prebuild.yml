name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2022
            platform: win32
            arch: x64
            libc: unknown
          - os: windows-2022
            platform: win32
            arch: ia32
            libc: unknown
          # macOS
          - os: macos-13
            platform: darwin
            arch: x64
            libc: unknown
          - os: macos-14
            platform: darwin
            arch: arm64
            libc: unknown
          # Linux glibc
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            libc: glibc
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            libc: glibc
          # Linux musl (Alpine)
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            libc: musl
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            libc: musl

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # musl builds need Alpine container
      - name: Build in Alpine container (musl)
        if: matrix.libc == 'musl'
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            alpine:3.19 \
            sh -c "
              apk add --no-cache python3 make g++ git nodejs npm linux-headers
              npm install --ignore-scripts
              for napi in 3 6; do
                binding_dir=lib/binding/napi-v\${napi}-${{ matrix.platform }}-${{ matrix.libc }}-${{ matrix.arch }}
                npx @mapbox/node-pre-gyp configure build --target_arch=${{ matrix.arch }} --napi_build_version=\${napi}
                mkdir -p \${binding_dir}
                cp build/Release/eva_sqlite3.node \${binding_dir}/
                npx @mapbox/node-pre-gyp package --target_arch=${{ matrix.arch }} --napi_build_version=\${napi}
              done
            "

      - name: Install dependencies (non-musl)
        if: matrix.libc != 'musl'
        run: npm install --ignore-scripts

      - name: Build & Package (non-musl)
        if: matrix.libc != 'musl'
        shell: bash
        run: |
          for napi in 3 6; do
            binding_dir="lib/binding/napi-v${napi}-${{ matrix.platform }}-${{ matrix.libc }}-${{ matrix.arch }}"
            npx @mapbox/node-pre-gyp configure build --napi_build_version=${napi}
            node -e "
              const fs = require('fs');
              const path = require('path');
              const src = path.join('${{ github.workspace }}', 'build', 'Release', 'eva_sqlite3.node');
              const destDir = path.join('${{ github.workspace }}', '${binding_dir}');
              fs.mkdirSync(destDir, { recursive: true });
              fs.copyFileSync(src, path.join(destDir, 'eva_sqlite3.node'));
              console.log('Copied', src, '->', path.join(destDir, 'eva_sqlite3.node'));
            "
            npx @mapbox/node-pre-gyp package --napi_build_version=${napi}
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: prebuilt-${{ matrix.platform }}-${{ matrix.libc }}-${{ matrix.arch }}
          path: build/stage/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
