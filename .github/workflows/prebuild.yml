name: Build Prebuilt Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-2022
            platform: win32
            arch: x64
            libc: unknown
          # macOS (macos-14 is ARM64, cross-compile x64 via Rosetta)
          - os: macos-14
            platform: darwin
            arch: x64
            libc: unknown
          - os: macos-14
            platform: darwin
            arch: arm64
            libc: unknown
          # Linux glibc
          - os: ubuntu-22.04
            platform: linux
            arch: x64
            libc: glibc
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            libc: glibc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build & Package
        shell: bash
        run: |
          npx @mapbox/node-pre-gyp configure build --target_arch=${{ matrix.arch }}

          # Copy both N-API versions to module_path first
          for napi in 3 6; do
            node -e "
              const fs = require('fs');
              const path = require('path');
              const cwd = process.cwd();
              const platform = '${{ matrix.platform }}';
              const libc = '${{ matrix.libc }}';
              const arch = '${{ matrix.arch }}';
              const src = path.join(cwd, 'build-tmp-napi-v${napi}', 'Release', 'eva_sqlite3.node');
              const destDir = path.join(cwd, 'lib', 'binding', 'napi-v${napi}-' + platform + '-' + libc + '-' + arch);
              fs.mkdirSync(destDir, { recursive: true });
              fs.copyFileSync(src, path.join(destDir, 'eva_sqlite3.node'));
              console.log('Copied', src, '->', path.join(destDir, 'eva_sqlite3.node'));
            "
          done

          # Package each version
          for napi in 3 6; do
            npx @mapbox/node-pre-gyp package --napi_build_version=${napi} --target_arch=${{ matrix.arch }}
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: prebuilt-${{ matrix.platform }}-${{ matrix.libc }}-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
