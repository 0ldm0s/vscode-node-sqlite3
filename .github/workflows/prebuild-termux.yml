name: Build Termux (Android) Prebuilt

# 手动触发（不挂 tag，不影响主工作流，避免多余消耗）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-termux:
    # 原生 arm64 runner（公开仓库免费），proot 跑 Termux rootfs 编译
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Install proot
        run: |
          sudo apt-get update
          sudo apt-get install -y proot xz-utils

      - name: Download Termux rootfs (aarch64)
        run: |
          URL=$(curl -s https://api.github.com/repos/termux/termux-docker/releases/latest \
            | jq -r '.assets[] | select(.name | test("aarch64")) | .browser_download_url' | head -1)
          if [ -z "$URL" ]; then
            echo "未找到 aarch64 rootfs 资产"
            exit 1
          fi
          echo "Rootfs URL: $URL"
          curl -L --retry 3 "$URL" -o rootfs.tar.xz
          mkdir rootfs
          tar -xJf rootfs.tar.xz -C rootfs

      - name: Build inside Termux (pkg install + npm build)
        run: |
          proot -0 \
            -r "$GITHUB_WORKSPACE/rootfs" \
            -b /dev -b /proc -b /sys -b /etc/resolv.conf \
            -b "$GITHUB_WORKSPACE:/usr/src/build" \
            -w /usr/src/build \
            "$GITHUB_WORKSPACE/rootfs/data/data/com.termux/files/usr/bin/bash" -c '
              set -e
              export PATH=/data/data/com.termux/files/usr/bin:$PATH
              export HOME=/data/data/com.termux/files/home
              export TMPDIR=$HOME/tmp
              mkdir -p "$TMPDIR"
              echo "--- 安装工具链 ---"
              pkg install -y nodejs clang make python binutils
              node --version
              npm --version
              echo "--- 安装依赖（跳过脚本）---"
              npm install --ignore-scripts
              echo "--- 编译 napi v3 + v6 ---"
              npx @mapbox/node-pre-gyp configure build
              echo "--- 编译产物 ---"
              ls -la build-tmp-napi-v3/Release/ build-tmp-napi-v6/Release/
            '

      - name: Package (android-unknown-arm64)
        run: |
          set -e
          rm -rf pack stage
          mkdir -p pack stage
          for napi in 3 6; do
            dir="napi-v${napi}-android-unknown-arm64"
            mkdir -p "pack/${dir}"
            cp "build-tmp-napi-v${napi}/Release/eva_sqlite3.node" "pack/${dir}/"
            tar -czf "stage/${dir}.tar.gz" -C pack "${dir}"
          done
          ls -la stage/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: prebuilt-android-unknown-arm64
          path: stage/*.tar.gz

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: stage/*.tar.gz
