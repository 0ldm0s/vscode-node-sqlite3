name: Build Termux (Android) Prebuilt

# 手动触发（不挂 tag，不影响主工作流，避免多余消耗）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-termux:
    # 原生 arm64 runner（公开仓库免费），docker 跑 Termux 官方镜像编译
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - name: Build inside Termux container
        run: |
          docker pull termux/termux-docker:latest
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/usr/src/build" \
            -w /usr/src/build \
            termux/termux-docker:latest \
            bash -c '
              set -e
              echo "--- 更新源并安装工具链 ---"
              pkg update -y && pkg install -y nodejs clang make python binutils
              node --version
              npm --version
              echo "--- 安装依赖（跳过脚本）---"
              npm install --ignore-scripts
              echo "--- 编译 napi v3 + v6 ---"
              npx @mapbox/node-pre-gyp configure build
              echo "--- 编译产物 ---"
              ls -la build-tmp-napi-v3/Release/ build-tmp-napi-v6/Release/
              chown -R 1001:1001 build-tmp-napi-v3 build-tmp-napi-v6
            '

      - name: Package (android-unknown-arm64)
        run: |
          set -e
          rm -rf pack stage
          mkdir -p pack stage
          for napi in 3 6; do
            dir="napi-v${napi}-android-unknown-arm64"
            mkdir -p "pack/${dir}"
            cp "build-tmp-napi-v${napi}/Release/eva_sqlite3.node" "pack/${dir}/"
            tar -czf "stage/${dir}.tar.gz" -C pack "${dir}"
          done
          ls -la stage/

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: prebuilt-android-unknown-arm64
          path: stage/*.tar.gz

      - name: Read version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          files: stage/*.tar.gz
